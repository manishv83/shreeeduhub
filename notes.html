<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Library - Shree Vani Tutorial</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>
<body>

    <script src="header.js"></script>

    <div class="notes-container">
        <div class="filter-section">
            <label for="topic-filter"><strong>Browse by Subject:</strong></label>
            <select id="topic-filter" onchange="filterNotes()">
                <option value="all">All Subjects</option>
                <option value="Quantum Mechanics">Quantum Mechanics</option>
                <option value="Thermal Physics">Thermal Physics</option>
                <option value="Electricity and Magnetism">Electricity and Magnetism</option>
                <option value="Optics">Optics</option>
            </select>
        </div>

        <h1 style="margin-bottom: 20px; color: #2c3e50;">Physics Study Library</h1>
        <div id="notes-grid" class="notes-grid">
            </div>
    </div>

    

    <script>
        let allNotes = [];

        async function loadNotes() {
            try {
                // Fetch from the file we fixed earlier
                const response = await fetch('notes-list.json?v=' + Date.now());
                if (!response.ok) throw new Error("Database file not found");
                
                allNotes = await response.json();
                renderNotes(allNotes);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('notes-grid').innerHTML = 
                    `<p style="color:red; padding:20px;">Unable to load notes. Error: ${error.message}</p>`;
            }
        }

        function renderNotes(data) {
            const grid = document.getElementById('notes-grid');
            if (data.length === 0) {
                grid.innerHTML = "<p>No notes found for this category.</p>";
                return;
            }
            grid.innerHTML = data.map(note => `
                <div class="note-card">
                    <span class="tag">${note.topic}</span>
                    <h3>${note.title}</h3>
                    <p>${note.description}</p>
                    <a href="view-note.html?file=${note.file}" class="read-btn">Read Note</a>
                </div>
            `).join('');
        }

        function filterNotes() {
            const val = document.getElementById('topic-filter').value;
            const filtered = val === 'all' ? allNotes : allNotes.filter(n => n.topic === val);
            renderNotes(filtered);
        }

        // Start the process
        window.onload = loadNotes;
    </script>
    <script src="footer.js"></script>
</body>
</html>
