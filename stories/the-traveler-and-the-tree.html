<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gratitude Story | Shree Vani Tutorial</title>
    <link rel="stylesheet" href="../src/style.css">
</head>
<body>

    <main class="story-card">
        <header class="story-header">
            <h1>The Traveler and the Tree</h1>
        </header>

        <section class="story-content">
            <p>On a burning hot day, a traveler found shade under a giant tree...</p>
            
            <img src="your-image-url.jpg" alt="Traveler under tree" class="story-image">

            <p>The tree gave him fruit, but the traveler was ungrateful. The tree reminded him to be thankful.</p>
        </section>

        <section class="interactive-quiz">
            <h3>Quick Check!</h3>
            <div class="quiz-item">
                <p><strong>What is the moral of the story?</strong></p>
                <button class="ans-btn" onclick="reveal('ans1')">See Answer</button>
                <div id="ans1" class="hidden-answer">Gratitude: Always say thank you for help!</div>
            </div>
        </section>
    </main>

    <script>
        function reveal(id) {
            let item = document.getElementById(id);
            item.style.display = (item.style.display === "block") ? "none" : "block";
        }
    </script>
     <script src="../src/script.js"></script>

   <script src="../src/header.js"></script>
    <script src="../src/footer.js"></script>
</body>
</html>
